[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ensemble-methods-kit"
version = "0.1.0"
description = "From-scratch NumPy toolkit of ensemble learning methods with a demo workflow."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Muhtasim-Munif-Fahim", email = "s1911024120@ru.ac.bd"}]
keywords = ["ensemble-learning", "machine-learning", "numpy", "bagging", "boosting", "stacking", "random-forest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
demo = ["scikit-learn>=1.1"]
dev = ["pytest>=7.0", "scikit-learn>=1.1"]

[project.scripts]
ensemble-methods = "ensemble_methods_kit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
